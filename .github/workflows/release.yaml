name: Build and release Android APK

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SIGNING_STORE_FILE: app/release.jks
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_count=$(grep -c '^VERSION_NAME=' gradle.properties || true)
          version=$(sed -n 's/^VERSION_NAME=//p' gradle.properties | tr -d '\r')

          if [[ "$version_count" != "1" || -z "$version" || "$version" == *$'\n'* ]]; then
            echo "::error::Expected exactly one nonempty VERSION_NAME in gradle.properties"
            exit 1
          fi

          git check-ref-format "refs/tags/$version"
          printf 'name=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v3
        with:
           packages: "platform-tools platforms;android-36 build-tools;36.0.0"
           accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          : "${KEYSTORE_BASE64:?Missing ANDROID_KEYSTORE_BASE64}"
          : "${SIGNING_KEY_ALIAS:?Missing SIGNING_KEY_ALIAS}"
          : "${SIGNING_KEY_PASSWORD:?Missing SIGNING_KEY_PASSWORD}"
          : "${SIGNING_STORE_PASSWORD:?Missing SIGNING_STORE_PASSWORD}"

          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$SIGNING_STORE_FILE"
          test -s "$SIGNING_STORE_FILE"

      - name: Build release APK
        run: bash ./gradlew --no-daemon assembleFossRelease

      - name: Check release APK exists
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          apks=(app/build/outputs/apk/foss/release/*release.apk)

          if (( ${#apks[@]} == 0 )); then
            echo "::error::No release APK found"
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.version.outputs.name }}
          name: ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/foss/release/*release.apk

      - name: Remove signing keystore
        if: always()
        shell: bash
        run: rm -f "$SIGNING_STORE_FILE"
